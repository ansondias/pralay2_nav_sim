# Shared by both runtimes:
#   * hardware: loaded into the ros2_control_node that
#     launch/controllers.launch.py starts (sim:=false)
#   * Gazebo:   loaded by gz_ros2_control inside gz-sim, via the <parameters>
#     tag in ros_pralay_2_v1/urdf/ROS_PRALAY_2_V1.gazebo.xacro (sim:=true)
# Joint names must match ros_pralay_2_v1/urdf/ros2_control.urdf.xacro.
controller_manager:

  ros__parameters:

    update_rate: 100
    # enforce_command_limits: true


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fin_controller:
      type: forward_command_controller/ForwardCommandController

    thruster_controller:
      type: forward_command_controller/ForwardCommandController





joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100



fin_controller:
  ros__parameters:
    joints:
      - Fin_Top_Joint
      - Fin_Left_Joint
      - Fin_Right_Joint
      - Fin_Bottom_Joint

    interface_name: position



thruster_controller:
  ros__parameters:
    joints:
      - T1_Joint

    interface_name: velocity