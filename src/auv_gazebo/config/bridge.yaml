- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/dvl_odom"
  gz_topic_name: "/dvl_odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Absolute depth setpoint for auv_current_plugin::ThrustControl's depth hold
# (metres below the surface, see surface_z in the hull's gazebo xacro):
#   ros2 topic pub --once /depth_setpoint std_msgs/msg/Float64 "{data: 3.0}"
# One entry per spawnable model name (spawn.launch.py's `robot` arg).
- ros_topic_name: "/depth_setpoint"
  gz_topic_name: "/model/pralay2/depth_setpoint"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/depth_setpoint"
  gz_topic_name: "/model/auv/depth_setpoint"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
